metrics_config:
  # Fallback robot radius, for runs without per-robot data.
  robot_radius: 0.27
  # Per model, matched by the longest prefix of the robot's name
  # (turtlebot2_1 -> turtlebot2). From the collision geometry Gazebo loads
  # (xacro -> gz sdf -p, 2026-09-17): the TurtleBot2 base cylinder, and the
  # Jackal's 0.49 x 0.43 m collision box by its half-diagonal. The tuning
  # simulator uses the same values (swarm_control/tuning/scenarios.py).
  robot_radii:
    turtlebot2: 0.178
    jackal: 0.326
  # A person's body, for clearances and proxemic zones. (HuNav's collision
  # cylinder is 0.4 m; that is the geometry Gazebo's contact sensor sees.)
  agent_radius: 0.17
  period: 5
  min_velocity: 0.08
  min_angular_velocity: 0.01
  max_accel: 1.0
  max_jerk: 0.5
  goal_tolerance: 0.3
  alpha: 0.1
  distance_threshold: 0.2

metrics:
  # - time_to_reach_goal
  - path_length
  - cumulative_heading_changes
  - avg_distance_to_closest_person
  - minimum_distance_to_people
  - maximum_distance_to_people
  - intimate_space_intrusions
  - personal_space_intrusions
  - social_space_intrusions
  - public_space_intrusions
  - group_intimate_space_intrusions
  - group_personal_space_intrusions
  - group_social_space_intrusions
  - group_public_space_intrusions
  - robot_on_person_collision
  - person_on_robot_collision
  - time_not_moving
  # - completed
  # - final_goal_distance
  # - minimum_goal_distance
  - avg_robot_linear_speed
  - avg_robot_angular_speed
  - avg_acceleration
  - avg_overacceleration
  - avg_pedestrian_velocity
  - avg_closest_pedestrian_velocity
  - social_force_on_agents
  - social_force_on_robot
  - social_work
  - social_work_per_second
  - obstacle_force_on_agents
  - obstacle_force_on_robot
  # Fleet metrics -- need per-robot data (a `robots:` mapping in the
  # experiment config); NaN on single-robot pickles. The drift hold point
  # defaults to the first centroid sample; override with a
  # `hold_point: [x, y]` entry in metrics_config. The social potential uses
  # the swarm_control SocialCost defaults; override A_soc, sigma_front0, k_v,
  # sigma_rear, sigma_left, sigma_right in metrics_config.
  # For the perturbation task (a stability test) score centroid_settled_motion
  # + formation_spread_growth: the fleet may end up parked away from the hold
  # point, so what counts is that the centroid stopped moving and the robots
  # stayed together. The drift metrics are descriptive -- their peak is the
  # transient the humans are meant to cause, not a defect. settle_window (s,
  # default 10) sets how much of the tail counts as settled.
  # For the formation task the centroid is *supposed* to travel, so only
  # formation_spread_growth carries over (did the shape survive the trip?); the
  # per-robot social metrics above come from the evaluator as usual.
  # - centroid_max_drift
  # - centroid_mean_drift
  # - centroid_settled_motion
  # - formation_spread_growth
  # - fleet_social_potential_mean
  # - fleet_social_potential_max
  # - fleet_min_distance_to_people
  # - fleet_avg_distance_to_closest_person
