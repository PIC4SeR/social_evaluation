overtaking:
  transforms:
    - map_to_base_link:
        child_frame_id: "base_link"
        frame_id: "map"

  map_file: maps/test_v1_v2.yaml

  robot_dynamics:
    period_for_diff: 5
    max_velocity: 0.5
    max_angular_velocity: 0.5
    alpha: 0.1

  examined_people:
    - U_1.U_1

